<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo app de escritorio / Dark Mode -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Gradiente neón para la línea -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gradiente para el dato pescado -->
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Efectos de sombra y resplandor -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base del Ícono de App (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#334155" stroke-width="3" />

  <!-- Nube Minimalista de Fondo (Entorno Cloud) -->
  <path d="M 150 350 
           H 350 
           A 45 45 0 0 0 390 270 
           A 60 60 0 0 0 280 215 
           A 65 65 0 0 0 160 270 
           A 40 40 0 0 0 150 350 Z" fill="#1E293B" fill-opacity="0.4" stroke="#475569" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Caña de Pescar Minimalista -->
  <path d="M 120 370 L 330 160" fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Cuerda / Sedal -->
  <path d="M 330 160 
           C 420 160, 390 280, 270 280" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Anzuelo Reducido y Limpio (Sin líneas extrañas en la punta) -->
  <g transform="translate(10, 20)">
    <!-- Ojo del anzuelo -->
    <circle cx="260" cy="260" r="4" fill="none" stroke="#E2E8F0" stroke-width="3" />
    
    <!-- Caña y Curva del Anzuelo en un solo trazo continuo con la punta -->
    <path d="M 260 264 
             V 310 
             A 18 18 0 0 1 224 310 
             V 290 
             L 218 298" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  </g>

  <!-- El "Dato / Log" Pescado -->
  <g filter="url(#glow)">
    <rect x="252" y="340" width="30" height="30" rx="6" fill="url(#dataGrad)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Símbolo interno de código (<>) -->
    <path d="M 261 350 L 256 355 L 261 360 M 273 350 L 278 355 L 273 360" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Partículas de datos flotando alrededor -->
  <rect x="300" y="315" width="12" height="12" rx="3" fill="#38BDF8" opacity="0.8" filter="url(#glow)" />
  <rect x="200" y="345" width="10" height="10" rx="2" fill="#22D3EE" opacity="0.6" />
  <circle cx="320" cy="340" r="3" fill="#7DD3FC" opacity="0.9" />
  <circle cx="185" cy="325" r="3" fill="#38BDF8" opacity="0.5" />
</svg>